
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>CRICXCRATE — Live Streams</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true"><div class="bg__glow"></div></div>

<header class="header">
  <div class="header__inner">
    <a class="brand" href="#">
      <span class="brand__mark">CC</span>
      <span class="brand__word">CRICXCRATE</span>
      <span class="brand__live">LIVE</span>
      <span class="brand__pill" id="liveCountPill" style="display:none">0 LIVE</span>
    </a>
    <div class="header__search" role="search">
      <input id="searchInput" type="search" placeholder="Search event, series…" autocomplete="off">
    </div>
    <div class="header__actions">
      <button class="icon-btn" id="refreshBtn" title="Refresh">↻</button>
    </div>
  </div>
</header>

<section class="hero" id="featured" hidden>
  <div class="hero__media" id="heroMedia"></div>
  <div class="hero__scrim"></div>
  <div class="hero__inner">
    <div class="hero__copy">
      <div class="hero__eyebrow"><i></i> Featured Live</div>
      <h1 id="heroTitle" class="hero__title"></h1>
      <p id="heroMeta" class="hero__meta"></p>
      <div class="hero__actions">
        <button class="btn btn--primary" id="heroPlayBtn">▶ Watch Live</button>
      </div>
    </div>
  </div>
</section>

<div class="rail">
  <div class="rail__inner">
    <div class="tabs" id="statusTabs">
      <button class="tab is-active" data-status="all">All</button>
      <button class="tab tab--live" data-status="live">● Live</button>
      <button class="tab" data-status="upcoming">Upcoming</button>
    </div>
  </div>
</div>

<main class="main">
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" hidden>
    <h3>No events found</h3>
    <p>Try a different search or check back later.</p>
  </div>
</main>

<div class="toast" id="toast"></div>
<script src="sw-register.js"></script>
<script src="app.js"></script>
</body>
</html>
