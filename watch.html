<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CricXCrate — Secure Player</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; }
  .player-container { width: 100%; height: 100%; display: grid; place-items: center; position: relative; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .back-btn { position: absolute; top: 20px; left: 20px; z-index: 100; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; backdrop-filter: blur(4px); }
  .error-box { position: absolute; color: #ff3b47; font-family: sans-serif; text-align: center; padding: 20px; background: rgba(0,0,0,0.8); border-radius: 8px; z-index: 50; }
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
<div class="player-container">
  <button class="back-btn" onclick="window.close()">✕ Exit Player</button>
  <video id="video" playsinline controls autoplay></video>
  <div id="errorMsg" class="error-box" style="display:none;"></div>
</div>
<script src="sw-register.js"></script>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const pid = params.get('play');
  const rawUrl = params.get('url');
  let streamUrl = '';
  let title = 'CricXCrate Stream';

  if(pid){
    try{
      const raw = sessionStorage.getItem('_fc_play_'+pid) || localStorage.getItem('_fc_play_'+pid);
      if(raw){
        const p = JSON.parse(raw);
        streamUrl = p.url;
        title = p.title || title;
      }
    }catch{}
  } else if(rawUrl){
    streamUrl = rawUrl;
  }

  document.title = title + " — CricXCrate";
  const video = document.getElementById('video');
  const errBox = document.getElementById('errorMsg');

  if(!streamUrl){
    errBox.textContent = "Error: Stream link not found or expired.";
    errBox.style.display = 'block';
    return;
  }

  if(streamUrl.includes('.m3u8') && window.Hls && Hls.isSupported()){
    const hls = new Hls({
      debug: false,
      enableWorker: true,
      lowLatencyMode: true,
      backBufferLength: 90
    });
    
    hls.loadSource(streamUrl);
    hls.attachMedia(video);
    
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(err => {
        console.warn("Autoplay blocked, requiring interaction", err);
      });
    });

    hls.on(Hls.Events.ERROR, function(event, data) {
      console.warn("HLS Error:", data);
      if (data.fatal) {
        switch(data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            console.log("Trying to recover from network error...");
            hls.startLoad();
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            console.log("Trying to recover from media error...");
            hls.recoverMediaError();
            break;
          default:
            hls.destroy();
            errBox.textContent = "Stream blocked or offline (CORS/Network issue).";
            errBox.style.display = 'block';
            break;
        }
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = streamUrl;
    video.addEventListener('loadedmetadata', () => {
      video.play().catch(()=>{});
    });
  } else {
    errBox.textContent = "HLS is not supported in this browser.";
    errBox.style.display = 'block';
  }
})();
</script>
</body>
</html>
